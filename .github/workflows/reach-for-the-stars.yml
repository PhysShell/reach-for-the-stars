name: Reach for the stars

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: stars-kb-writer
  cancel-in-progress: false

jobs:
  fetch-stars:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: keep previous stars
        run: cp assets/data/stars.json "$RUNNER_TEMP/stars.old.json"

      - name: list stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stars_kb.py list --user "${{ github.repository_owner }}" --out assets/data/stars.json

      - name: fetch new stars for the knowledge base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stars_kb.py delta --old "$RUNNER_TEMP/stars.old.json" --new assets/data/stars.json --out "$RUNNER_TEMP/delta.jsonl.gz"

      # stars.json is the checkpoint of processed stars, so it is pushed only after the delta is in the release.
      - name: encrypt and upload delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s assets/stars-kb.pub ] || { echo "assets/stars-kb.pub is missing"; exit 1; }
          [ -s "$RUNNER_TEMP/delta.jsonl.gz" ] || { echo "no new stars"; exit 0; }
          go install filippo.io/age/cmd/age@v1.3.1
          name="delta-$(date -u +%Y%m%dT%H%M%S).jsonl.gz.age"
          "$(go env GOPATH)/bin/age" -R assets/stars-kb.pub -o "$RUNNER_TEMP/$name" "$RUNNER_TEMP/delta.jsonl.gz"
          gh release view stars-kb >/dev/null 2>&1 || gh release create stars-kb --title "Stars knowledge base (encrypted)" --notes "age (ML-KEM-768 + X25519) encrypted corpus of starred repositories. See scripts/stars_kb.py."
          gh release upload stars-kb "$RUNNER_TEMP/$name"

      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/stars.json
          git diff-index --quiet HEAD || (git commit -m "chore: update stars" --allow-empty)

      - name: push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
